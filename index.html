<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özel Davetiye</title>
  <!-- Google Fonts - Lüks Yazı Tipleri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2c1b30 0%, #120913 100%);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      perspective: 1200px;
    }

    /* Arka Plan Işıltı Animasyonu */
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      animation: pulseGlow 4s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    /* 3D Kart Konteyneri */
    .invitation-card {
      width: 380px;
      height: 580px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
      z-index: 2;
    }

    .invitation-card.flipped {
      transform: rotateY(180deg);
    }

    /* Kart Yüzleri */
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      background: #faf8f5;
      border: 2px solid #d4af37;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 20px;
      text-align: center;
      overflow: hidden;
    }

    /* İç Çerçeve / Süsleme */
    .border-pattern {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 1px solid #d4af37;
      border-radius: 10px;
      pointer-events: none;
    }

    .border-pattern::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      border: 1px dashed #c59b27;
      border-radius: 8px;
    }

    /* ÖN YÜZ TASARIMI */
    .monogram {
      font-family: 'Cinzel', serif;
      font-size: 2.8rem;
      color: #b8860b;
      margin-top: 20px;
      letter-spacing: 4px;
      border-bottom: 1px solid #d4af37;
      padding-bottom: 5px;
    }

    .front-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      color: #2c1b30;
      line-height: 1.2;
      margin: 20px 0;
    }

    .front-subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: #7a632a;
      text-transform: uppercase;
    }

    .click-badge {
      background: linear-gradient(45deg, #b8860b, #e6ca65, #b8860b);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3);
      animation: bounce 2s infinite;
    }

    /* ARKA YÜZ TASARIMI (Detaylar) */
    .card-back {
      transform: rotateY(180deg);
      background: #ffffff;
    }

    .names {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: #8b0000;
      margin-top: 15px;
    }

    .and-symbol {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: #d4af37;
      display: block;
      margin: -5px 0;
    }

    .invitation-text {
      font-size: 0.85rem;
      color: #555;
      line-height: 1.6;
      margin: 15px 10px;
      font-style: italic;
    }

    .details-box {
      width: 100%;
      border-top: 1px solid rgba(212, 175, 55, 0.3);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding: 12px 0;
      margin-bottom: 10px;
    }

    .date-time {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: #2c1b30;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .location {
      font-size: 0.8rem;
      color: #666;
    }

    .rsvp-btn {
      display: inline-block;
      text-decoration: none;
      background: #2c1b30;
      color: #d4af37;
      padding: 8px 18px;
      border-radius: 5px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      border: 1px solid #d4af37;
      transition: all 0.3s;
    }

    .rsvp-btn:hover {
      background: #d4af37;
      color: #2c1b30;
    }

    /* Animasyonlar */
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Davetiye Kartı -->
  <div class="invitation-card" id="card">
    
    <!-- Ön Yüz -->
    <div class="card-front">
      <div class="border-pattern"></div>
      <div class="monogram">S & A</div>
      <div>
        <div class="front-subtitle">Davetlisiniz</div>
        <div class="front-title">Düğün Töreni</div>
      </div>
      <div class="click-badge">Detaylar İçin Tıklayın</div>
    </div>

    <!-- Arka Yüz -->
    <div class="card-back">
      <div class="border-pattern"></div>
      
      <div class="names">
        Selin Yılmaz
        <span class="and-symbol">&</span>
        Ali Kaya
      </div>

      <p class="invitation-text">
        "Hayatımızın en özel gününde, mutluluğumuzu sizinle paylaşmaktan onur duyarız."
      </p>

      <div class="details-box">
        <div class="date-time">12 EYLÜL 2026 | 19:30</div>
        <div class="location">
          <strong>Grand Balo Salonu</strong><br>
          Atatürk Cad. No: 123, İstanbul
        </div>
      </div>

      <a href="https://maps.google.com" target="_blank" class="rsvp-btn" onclick="event.stopPropagation();">
        📍 Haritada Göster / Yol Tarifi
      </a>
    </div>

  </div>

  <script>
    const card = document.getElementById('card');

    card.addEventListener('click', () => {
      card.classList.toggle('flipped');
    });
  </script>

</body>
</html>
